# Docker Engine from Docker's own apt repository (Ubuntu's docker.io lags behind).
- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Install Docker's apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker's apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ deb_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  become: true

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    state: present
    update_cache: true
  become: true

- name: Start Docker on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

# The new group only applies to new login sessions; k8s_cluster wraps its
# minikube calls in `sg docker` so this same run still works.
- name: Let {{ target_user }} use Docker without sudo
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: true
  become: true
