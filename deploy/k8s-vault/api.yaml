# The injector's sidecar logs in with the pod's ServiceAccount (Vault role "api"), then keeps
# these files under /vault/secrets fresh. The app reads <VAR>_FILE (docs/runtime-contract.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "api"
        vault.hashicorp.com/agent-inject-token: "true"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/gstr2b/db"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/data/gstr2b/db" -}}
          postgresql+psycopg://{{ .Data.data.username }}:{{ .Data.data.password }}@postgres:5432/gstr2b
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/gstr2b/app"
        vault.hashicorp.com/agent-inject-template-jwt: |
          {{- with secret "secret/data/gstr2b/app" -}}{{ .Data.data.jwt_secret }}{{- end -}}
        vault.hashicorp.com/agent-inject-secret-admin: "secret/data/gstr2b/app"
        vault.hashicorp.com/agent-inject-template-admin: |
          {{- with secret "secret/data/gstr2b/app" -}}{{ .Data.data.admin_password }}{{- end -}}
        # The default sidecar request (250m CPU) would skew the HPA's utilisation maths
        # Sidecar runs as the app's uid so the app can read the files it writes (the token file
        # was 0640 owned by the agent's own user: Permission denied, uploads got 503)
        vault.hashicorp.com/agent-run-as-user: "10001"
        vault.hashicorp.com/agent-run-as-group: "10001"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
    spec:
      containers:
        - name: api
          env:
            - name: DATABASE_URL_FILE
              value: /vault/secrets/db
            - name: JWT_SECRET_FILE
              value: /vault/secrets/jwt
            - name: ADMIN_PASSWORD_FILE
              value: /vault/secrets/admin
            - name: VAULT_TOKEN_FILE
              value: /vault/secrets/token
