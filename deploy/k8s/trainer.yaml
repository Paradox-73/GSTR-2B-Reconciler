# Nightly retrain (DESIGN.md 9.2). Skips unless 50+ new review decisions exist; a model that fails
# the quality gate is registered but not promoted. On demand:
#   kubectl -n gstr2b create job --from=cronjob/trainer trainer-manual-$(date +%s)
# (that run still skips under 50 labels; Jenkins runs `python -m trainer --force` for a forced one)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trainer
  labels:
    app.kubernetes.io/name: trainer
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trainer
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trainer
              image: DOCKERHUB_USER/gstr2b-trainer:latest
              envFrom:
                - configMapRef:
                    name: gstr2b-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: gstr2b-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
