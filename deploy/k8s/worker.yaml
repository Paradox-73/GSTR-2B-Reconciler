apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  # No replicas field: the HPA (hpa.yaml) owns it.
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      # Target setup once Vault (#19) is live; see api.yaml.
      # annotations:
      #   vault.hashicorp.com/agent-inject: "true"
      #   vault.hashicorp.com/role: "worker"
      #   vault.hashicorp.com/agent-inject-secret-db: "secret/data/gstr2b/db"
      #   vault.hashicorp.com/agent-inject-template-db: |
      #     {{- with secret "secret/data/gstr2b/db" -}}
      #     postgresql+psycopg://{{ .Data.data.username }}:{{ .Data.data.password }}@postgres:5432/gstr2b
      #     {{- end -}}
    spec:
      serviceAccountName: worker
      # Gives a running job time to finish before the pod is killed during a rollout.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: DOCKERHUB_USER/gstr2b-worker:latest
          envFrom:
            - configMapRef:
                name: gstr2b-config
          env:
            # With Vault: delete DATABASE_URL below and uncomment this.
            # - name: DATABASE_URL_FILE
            #   value: /vault/secrets/db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gstr2b-secrets
                  key: DATABASE_URL
          # The worker has no HTTP port. Its poll thread touches /tmp/worker-alive every
          # MODEL_POLL_SECONDS (60); a shell age check costs nothing, unlike starting Python to
          # ask Redis (that cost ~100m CPU per idle pod and kept the HPA pinned at 5).
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/worker-alive"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "test $(( $(date +%s) - $(stat -c %Y /tmp/worker-alive) )) -lt 180"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
