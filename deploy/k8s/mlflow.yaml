# Week 4: model registry for the trainer and workers (DESIGN.md 9.4).
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.17.2
          # shortcut: the stock image has no PostgreSQL driver, so it is installed on every start
          # (needs internet). Bake it into a small image FROM this one when week 4 starts.
          command: ["sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir --quiet --target /tmp/pydeps psycopg2-binary==2.9.10 &&
              exec mlflow server --host 0.0.0.0 --port 5000 --workers 1
              --backend-store-uri "$MLFLOW_DATABASE_URL"
              --artifacts-destination /mlartifacts
          env:
            - name: PYTHONPATH
              value: /tmp/pydeps
            - name: MLFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gstr2b-secrets
                  key: MLFLOW_DATABASE_URL
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
