# Template only. Copy to secret.yaml (gitignored), replace every CHANGE_ME, then:
#   kubectl apply -f deploy/k8s/secret.yaml
# Not listed in kustomization.yaml on purpose. Vault (issue #19) replaces this file.
apiVersion: v1
kind: Secret
metadata:
  name: gstr2b-secrets
  namespace: gstr2b
type: Opaque
stringData:
  # The password must be the same in all three places below.
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql+psycopg://gstr2b:CHANGE_ME@postgres:5432/gstr2b
  JWT_SECRET: CHANGE_ME
  ADMIN_PASSWORD: CHANGE_ME
