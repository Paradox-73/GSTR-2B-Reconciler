# Filebeat -> Logstash -> Elasticsearch (DESIGN.md 14).
# App services log one JSON object per line (docs/runtime-contract.md). Those lines are
# parsed into fields under [app]; anything else (nginx access logs, tracebacks, other
# pods) is kept as plain text and tagged non_json.

input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      # A nested target keeps app keys such as "event" from clashing with ECS fields Beats adds.
      target => "app"
      remove_field => ["message"]
      tag_on_failure => ["non_json"]
    }
    if [app][ts] {
      date {
        match => ["[app][ts]", "ISO8601"]
      }
    }
  } else {
    mutate {
      add_tag => ["non_json"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "gstr2b-logs-%{+YYYY.MM.dd}"
  }
}
