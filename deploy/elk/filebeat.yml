# Runs as a DaemonSet (roles/elk) and tails every container log on the node.
filebeat.inputs:
  - type: filestream
    id: kubernetes-containers
    paths:
      - /var/log/containers/*.log
    prospector.scanner.symlinks: true
    parsers:
      - container: ~
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
      # System pods and the ELK stack itself would flood the index and add nothing to the dashboards.
      - drop_event:
          when:
            or:
              - equals:
                  kubernetes.namespace: kube-system
              - equals:
                  kubernetes.namespace: logging

output.logstash:
  hosts: ["logstash:5044"]
