# Optional ELK add-on for the local stack (K8s uses roles/elk). Needs ~3GB more RAM.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.elk.yml up -d
# Kibana: http://localhost:5601 (dashboards are imported by kibana-setup)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"  # ports bound to 127.0.0.1 below; in K8s only in-cluster
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [esdata:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      retries: 40

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes: [./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro]
    depends_on:
      elasticsearch: {condition: service_healthy}

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root  # reads Docker's log files and socket
    command: ["filebeat", "-e", "--strict.perms=false", "-c", "/usr/share/filebeat/filebeat.yml"]
    volumes:
      - ./elk/filebeat.compose.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fbdata:/usr/share/filebeat/data  # read positions; without it a restart re-ships everything
    depends_on: [logstash]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      SECURITY_SHOWINSECURECLUSTERWARNING: "false"
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      retries: 40

  # Imports the data view + dashboards (deploy/elk/kibana-export.ndjson). Safe to rerun.
  kibana-setup:
    image: curlimages/curl:8.11.1
    volumes: [./elk/kibana-export.ndjson:/export.ndjson:ro]
    command: ["-fsS", "-X", "POST", "http://kibana:5601/api/saved_objects/_import?overwrite=true",
              "-H", "kbn-xsrf: true", "--form", "file=@/export.ndjson"]
    depends_on:
      kibana: {condition: service_healthy}

volumes:
  esdata:
  fbdata:
