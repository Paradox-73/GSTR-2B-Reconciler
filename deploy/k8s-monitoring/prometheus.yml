# Two jobs, both limited to the gstr2b namespace so the time series stay few on a laptop.
global:
  scrape_interval: 15s
scrape_configs:
  # App pods that opt in with prometheus.io/scrape + prometheus.io/port annotations
  # (api :8000, worker :9100).
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [gstr2b]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  # Per-pod CPU and memory from the kubelet's built-in cAdvisor, so no kube-state-metrics or
  # node-exporter is needed.
  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true  # the kubelet's serving cert is self-signed on minikube
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: gstr2b
        action: keep
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
        action: keep
