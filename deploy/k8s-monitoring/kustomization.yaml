# Prometheus + Grafana for the app (DESIGN.md 14). Applied by the Ansible `monitoring` role.
# Look at it with: kubectl -n monitoring port-forward svc/grafana 3000:3000
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml]
  - name: grafana-datasources
    files: [grafana/datasources.yaml]
  - name: grafana-dashboard-providers
    files: [grafana/dashboards.yaml]
  - name: grafana-dashboards
    files: [dashboards/gstr2b-ops.json]
