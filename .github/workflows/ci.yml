# Fast PR checks on GitHub. Jenkins runs the full build/deploy pipeline (DESIGN.md 13).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  # Renders/validates the deploy files so a broken manifest or playbook fails the PR, not the demo.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize builds
        run: |
          kubectl kustomize deploy/k8s > /dev/null
          kubectl kustomize deploy/k8s/migrations > /dev/null
          kubectl kustomize deploy/k8s-vault > /dev/null
      - name: ansible syntax
        run: |
          pip install -q ansible-core==2.17.7
          ansible-galaxy collection install -r deploy/ansible/requirements.yml > /dev/null
          cd deploy/ansible
          ansible-playbook --syntax-check -i inventory/hosts.ini site.yml
          ansible-playbook --syntax-check -i inventory/hosts.ini deploy.yml
      - name: compose files parse
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.elk.yml config -q
          cp deploy/jenkins/.env.example deploy/jenkins/.env
          docker compose -f deploy/jenkins/docker-compose.yml config -q
